name: Taskflow to VPS

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "server/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push image
        working-directory: ./server
        run: |
          VERSION=${GITHUB_REF_NAME:-latest}
          docker build -t ${{ secrets.DOCKER_USERNAME }}/taskflow-server:latest \
                       -t ${{ secrets.DOCKER_USERNAME }}/taskflow-server:$VERSION .
          docker push ${{ secrets.DOCKER_USERNAME }}/taskflow-server:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/taskflow-server:$VERSION

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            docker compose pull
            docker compose up -d
