version: "3.8"

services:
  db:
    image: mysql:8
    container_name: taskflow-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taskflow
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql

  server:
    build:
      context: ./server
    container_name: taskflow-server
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/taskflow
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

volumes:
  db_data:
